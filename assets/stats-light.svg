<svg width="620" height="200" viewBox="0 0 620 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0969da; }
    .stat-label { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #57606a; }
    .stat-value { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
  </style>
  <rect x="0.5" y="0.5" rx="8" width="619" height="199" fill="#ffffff" stroke="#e1e4e8"/>
  
  <!-- Left: Overview Stats -->
  <text x="25" y="40" class="header">GitHub Overview</text>
  
  <g transform="translate(25, 68)">
    <text x="0" y="0" class="stat-label">⭐ Total Stars Earned:</text>
    <text x="180" y="0" class="stat-value">14</text>
    
    <text x="0" y="26" class="stat-label">📦 Total Commits:</text>
    <text x="180" y="26" class="stat-value">334</text>
    
    <text x="0" y="52" class="stat-label">🔀 Pull Requests:</text>
    <text x="180" y="52" class="stat-value">23</text>
    
    <text x="0" y="78" class="stat-label">🎯 Issues Opened:</text>
    <text x="180" y="78" class="stat-value">0</text>
    
    <text x="0" y="104" class="stat-label">📚 Repositories:</text>
    <text x="180" y="104" class="stat-value">14</text>
  </g>

  <!-- Divider Line -->
  <line x1="300" y1="25" x2="300" y2="175" stroke="#e1e4e8" stroke-width="1" />

  <!-- Right: Top Languages -->
  <text x="330" y="40" class="header">Top Languages</text>
  
  <!-- Background progress bar -->
  <rect x="330" y="70" width="250" height="10" rx="5" fill="#eaeef2" />
  <g clip-path="url(#bar-clip)">
    <rect x="330.0" y="70" width="146.5" height="10" fill="#DA5B0B" /><rect x="476.5" y="70" width="45.3" height="10" fill="#f1e05a" /><rect x="521.8" y="70" width="28.0" height="10" fill="#3572A5" /><rect x="549.8" y="70" width="13.2" height="10" fill="#e34c26" /><rect x="563.0" y="70" width="11.2" height="10" fill="#663399" />
  </g>
  <clipPath id="bar-clip">
    <rect x="330" y="70" width="250" height="10" rx="5" />
  </clipPath>

  <!-- Language details -->
  
        <circle cx="335" cy="101" r="4" fill="#DA5B0B" />
        <text x="348" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">Jupyter Notebook</text>
        <text x="575" y="105" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#57606a">58.6%</text>
        
        <circle cx="335" cy="121" r="4" fill="#f1e05a" />
        <text x="348" y="125" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">JavaScript</text>
        <text x="575" y="125" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#57606a">18.1%</text>
        
        <circle cx="335" cy="141" r="4" fill="#3572A5" />
        <text x="348" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">Python</text>
        <text x="575" y="145" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#57606a">11.2%</text>
        
        <circle cx="335" cy="161" r="4" fill="#e34c26" />
        <text x="348" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">HTML</text>
        <text x="575" y="165" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#57606a">5.3%</text>
        
</svg>