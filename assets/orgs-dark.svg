<svg width="620" height="140" viewBox="0 0 620 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #58a6ff; }
    .sub-header { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .tile-title { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .tile-sub { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
  </style>
  <rect x="0.5" y="0.5" rx="8" width="619" height="139" fill="#0d1117" stroke="#30363d"/>
  
  <!-- Header -->
  <text x="25" y="36" class="header">Organizations &amp; Open Source</text>
  <text x="25" y="53" class="sub-header">Multi-year engineering contributions across open-source ecosystems</text>
  
  <!-- Tile 1: Organizations -->
  <g transform="translate(25, 68)">
    <rect width="180" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="14" y="22" class="tile-title">🏢 8 Organizations</text>
    <text x="14" y="39" class="tile-sub">Active OSS &amp; industry partners</text>
  </g>

  <!-- Tile 2: Active Timeline -->
  <g transform="translate(220, 68)">
    <rect width="180" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="14" y="22" class="tile-title">📅 2019 — 2026</text>
    <text x="14" y="39" class="tile-sub">8+ years continuous activity</text>
  </g>

  <!-- Tile 3: Contributions & Focus -->
  <g transform="translate(415, 68)">
    <rect width="180" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="14" y="22" class="tile-title">⚡ 164+ Activities</text>
    <text x="14" y="39" class="tile-sub">Cloud • AI • IaC • DevOps</text>
  </g>
