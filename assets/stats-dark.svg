<svg width="620" height="200" viewBox="0 0 620 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #58a6ff; }
    .stat-label { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .stat-value { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
  </style>
  <rect x="0.5" y="0.5" rx="8" width="619" height="199" fill="#0d1117" stroke="#30363d"/>
  
  <!-- Left: Overview Stats -->
  <text x="25" y="40" class="header">GitHub Overview</text>
  
  <g transform="translate(25, 68)">
    <text x="0" y="0" class="stat-label">⭐ Total Stars Earned:</text>
    <text x="180" y="0" class="stat-value">14</text>
    
    <text x="0" y="26" class="stat-label">📦 Total Commits:</text>
    <text x="180" y="26" class="stat-value">24</text>
    
    <text x="0" y="52" class="stat-label">🔀 Pull Requests:</text>
    <text x="180" y="52" class="stat-value">23</text>
    
    <text x="0" y="78" class="stat-label">🎯 Issues Opened:</text>
    <text x="180" y="78" class="stat-value">0</text>
    
    <text x="0" y="104" class="stat-label">📚 Repositories:</text>
    <text x="180" y="104" class="stat-value">15</text>
  </g>

  <!-- Divider Line -->
  <line x1="300" y1="25" x2="300" y2="175" stroke="#30363d" stroke-width="1" />

  <!-- Right: Top Languages -->
  <text x="330" y="40" class="header">Top Languages</text>
  
  <!-- Background progress bar -->
  <rect x="330" y="70" width="250" height="10" rx="5" fill="#21262d" />
  <g clip-path="url(#bar-clip)">
    <rect x="330.0" y="70" width="153.5" height="10" fill="#00ADD8" /><rect x="483.5" y="70" width="44.0" height="10" fill="#DA5B0B" /><rect x="527.5" y="70" width="18.0" height="10" fill="#3178c6" /><rect x="545.5" y="70" width="14.0" height="10" fill="#f1e05a" /><rect x="559.5" y="70" width="5.8" height="10" fill="#663399" />
  </g>
  <clipPath id="bar-clip">
    <rect x="330" y="70" width="250" height="10" rx="5" />
  </clipPath>

  <!-- Language details -->
  
        <circle cx="335" cy="101" r="4" fill="#00ADD8" />
        <text x="348" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">Go</text>
        <text x="575" y="105" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#8b949e">61.4%</text>
        
        <circle cx="335" cy="121" r="4" fill="#DA5B0B" />
        <text x="348" y="125" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">Jupyter Notebook</text>
        <text x="575" y="125" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#8b949e">17.6%</text>
        
        <circle cx="335" cy="141" r="4" fill="#3178c6" />
        <text x="348" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">TypeScript</text>
        <text x="575" y="145" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#8b949e">7.2%</text>
        
        <circle cx="335" cy="161" r="4" fill="#f1e05a" />
        <text x="348" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">JavaScript</text>
        <text x="575" y="165" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#8b949e">5.6%</text>
        
</svg>